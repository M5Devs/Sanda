name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dev container config is valid JSON
        run: jq empty .devcontainer/devcontainer.json

      - name: JavaScript parses
        run: |
          node --check .sanda/web/server.js
          node --check .sanda/web/public/app.js

      - name: Shell scripts parse
        run: |
          for file in .sanda/menu.sh .sanda/setup.sh .sanda/antigravity-desktop.sh .sanda/web/start.sh; do
            bash -n "$file"
          done

      - name: ShellCheck
        run: shellcheck -x .sanda/menu.sh .sanda/setup.sh .sanda/antigravity-desktop.sh .sanda/web/start.sh
